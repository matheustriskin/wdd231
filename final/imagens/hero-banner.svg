<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Fundo com Brilho Energético -->
  <rect width="540" height="380" rx="12" fill="#0f172a" />
  <circle cx="270" cy="180" r="170" fill="url(#glowGrad)" />

  <!-- Pódio / Base Tecnológica -->
  <ellipse cx="270" cy="310" rx="200" ry="25" fill="url(#podiumGrad)" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,4" />
  <ellipse cx="270" cy="305" rx="140" ry="16" fill="#1e293b" />

  <!-- Lata Esquerda (Zero Açúcar - inclinada) -->
  <g transform="translate(140, 90) rotate(-8)">
    <rect x="0" y="20" width="60" height="150" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <polygon points="32,45 25,68 31,68 26,90 40,62 33,62" fill="#06b6d4" />
    <text x="30" y="115" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800" fill="#f8fafc" text-anchor="middle">ZERO</text>
  </g>

  <!-- Lata Centro (Apex Ignite Principal - destaque) -->
  <g transform="translate(230, 60)">
    <rect x="0" y="20" width="80" height="190" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2" />
    <polygon points="44,50 34,85 43,85 36,115 56,76 46,76" fill="#f97316" />
    <text x="40" y="140" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">APEX</text>
    <text x="40" y="156" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="2">IGNITE</text>
    <text x="40" y="172" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">200mg Cafeína</text>
  </g>

  <!-- Lata Direita (Botanical Natural - inclinada) -->
  <g transform="translate(340, 90) rotate(8)">
    <rect x="0" y="20" width="60" height="150" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <polygon points="32,45 25,68 31,68 26,90 40,62 33,62" fill="#10b981" />
    <text x="30" y="115" font-family="'Montserrat', sans-serif" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle">CLEAN</text>
  </g>

  <!-- Partículas e Acentos de Energia -->
  <circle cx="100" cy="120" r="3" fill="#06b6d4" opacity="0.8" />
  <circle cx="440" cy="110" r="3.5" fill="#f97316" opacity="0.8" />
  <circle cx="80" cy="220" r="2.5" fill="#f97316" opacity="0.6" />
  <circle cx="460" cy="230" r="2.5" fill="#10b981" opacity="0.6" />

  <!-- Badge Flutuante 1: Zero Açúcar -->
  <rect x="50" y="60" width="115" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
  <text x="107" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#06b6d4" text-anchor="middle">0% Açúcar Adicionado</text>

  <!-- Badge Flutuante 2: Cafeína Pura -->
  <rect x="375" y="60" width="125" height="28" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="1" />
  <text x="437" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f97316" text-anchor="middle">Compostos Bioativos</text>
</svg>