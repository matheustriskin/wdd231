<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1200" width="380" height="1200">
  <defs>
    <style>
      .bg { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
      .header-box { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .element-box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 2,2; }
      .solid-box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
      .card-box { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
      .title-text { font-family: monospace, sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .sub-text { font-family: monospace, sans-serif; font-size: 10px; fill: #4b5563; }
      .tag-text { font-family: monospace, sans-serif; font-size: 9px; fill: #6b7280; }
      .btn-box { fill: #111827; stroke: #111827; }
      .btn-text { font-family: monospace, sans-serif; font-size: 10px; fill: #ffffff; font-weight: bold; }
      .line { stroke: #9ca3af; stroke-width: 1; }
      .img-cross { stroke: #9ca3af; stroke-width: 1; }
    </style>
  </defs>

  <!-- Device Canvas / Viewport Pequena (Mobile) -->
  <rect x="5" y="5" width="370" height="1190" rx="8" class="bg" />

  <!-- Barra de Titulo / Cabecalho Superior -->
  <rect x="15" y="15" width="350" height="50" rx="4" class="header-box" />
  <rect x="25" y="27" width="90" height="26" class="solid-box" />
  <text x="35" y="44" class="title-text">[LOGO]</text>
  <!-- Botao Hamburguer -->
  <rect x="320" y="27" width="32" height="26" rx="3" class="solid-box" />
  <line x1="326" y1="33" x2="346" y2="33" class="line" stroke-width="2" />
  <line x1="326" y1="40" x2="346" y2="40" class="line" stroke-width="2" />
  <line x1="326" y1="47" x2="346" y2="47" class="line" stroke-width="2" />

  <!-- Menu Hamburguer Aberto (Representacao de Estado) -->
  <rect x="15" y="72" width="350" height="70" rx="3" class="card-box" stroke-dasharray="3,3" />
  <text x="25" y="90" class="sub-text">&#9776; Inicio (Ativo) | Catalogo | Guia &amp; Contato</text>
  <text x="25" y="110" class="sub-text">&#9733; Favoritos (localStorage) [3]</text>
  <text x="25" y="130" class="tag-text">(Navegacao movel retratil / Wayfinding)</text>

  <!-- Secao Hero / Destaque -->
  <rect x="15" y="155" width="350" height="230" rx="4" class="solid-box" />
  <text x="30" y="180" class="title-text">SECAO HERO (BOAS-VINDAS)</text>
  <text x="30" y="200" class="sub-text">H1: Potencialize Seu Foco &amp; Energia</text>
  <!-- Caixa Imagem com X classico -->
  <rect x="30" y="215" width="320" height="95" class="card-box" />
  <line x1="30" y1="215" x2="350" y2="310" class="img-cross" />
  <line x1="350" y1="215" x2="30" y2="310" class="img-cross" />
  <text x="110" y="265" class="title-text">[IMAGEM EM DESTAQUE]</text>
  <!-- Botoes CTA Hero -->
  <rect x="30" y="325" width="150" height="35" rx="3" class="btn-box" />
  <text x="45" y="347" class="btn-text">EXPLORAR BEBIDAS</text>
  <rect x="195" y="325" width="155" height="35" rx="3" class="solid-box" />
  <text x="210" y="347" class="sub-text">CALCULAR CAFEINA</text>

  <!-- Secao Categorias em Destaque -->
  <rect x="15" y="400" width="350" height="240" rx="4" class="solid-box" />
  <text x="30" y="425" class="title-text">H2: CATEGORIAS EM DESTAQUE</text>
  <!-- Cards de Categorias -->
  <rect x="30" y="440" width="320" height="40" class="card-box" />
  <text x="45" y="465" class="sub-text">&#9889; Zero Acucar &amp; Caloria Baixa (Link)</text>
  <rect x="30" y="488" width="320" height="40" class="card-box" />
  <text x="45" y="513" class="sub-text">&#127807; Naturais &amp; Plant-Based (Link)</text>
  <rect x="30" y="536" width="320" height="40" class="card-box" />
  <text x="45" y="561" class="sub-text">&#127918; Foco Mental &amp; Gamer (Link)</text>
  <rect x="30" y="584" width="320" height="40" class="card-box" />
  <text x="45" y="609" class="sub-text">&#128170; Performance &amp; Pre-Treino (Link)</text>

  <!-- Secao Ingredientes Funcionais -->
  <rect x="15" y="655" width="350" height="225" rx="4" class="solid-box" />
  <text x="30" y="680" class="title-text">H2: INGREDIENTES FUNCIONAIS</text>
  <!-- 2 Cards compactos -->
  <rect x="30" y="695" width="152" height="75" class="card-box" />
  <text x="40" y="715" class="title-text">Taurina</text>
  <text x="40" y="733" class="tag-text">Metabolismo e</text>
  <text x="40" y="748" class="tag-text">resistencia fisica</text>

  <rect x="198" y="695" width="152" height="75" class="card-box" />
  <text x="208" y="715" class="title-text">Cafeina</text>
  <text x="208" y="733" class="tag-text">Alerta, vigilia e</text>
  <text x="208" y="748" class="tag-text">concentracao</text>

  <rect x="30" y="780" width="152" height="75" class="card-box" />
  <text x="40" y="800" class="title-text">Complexo B</text>
  <text x="40" y="818" class="tag-text">Conversao de</text>
  <text x="40" y="833" class="tag-text">energia celular</text>

  <rect x="198" y="780" width="152" height="75" class="card-box" />
  <text x="208" y="800" class="title-text">Cha Verde</text>
  <text x="208" y="818" class="tag-text">Antioxidantes e</text>
  <text x="208" y="833" class="tag-text">energia suave</text>

  <!-- Secao Destaque Interativo / Guia Consciente -->
  <rect x="15" y="895" width="350" height="135" rx="4" class="card-box" />
  <text x="30" y="920" class="title-text">H2: GUIA DE CONSUMO CONSCIENTE</text>
  <text x="30" y="940" class="sub-text">Calculadora de limite de cafeina por perfil.</text>
  <text x="30" y="955" class="tag-text">Entenda doses seguras e dicas nutricionais.</text>
  <rect x="30" y="975" width="320" height="35" rx="3" class="btn-box" />
  <text x="95" y="997" class="btn-text">CALCULAR MEU LIMITE DIARIO</text>

  <!-- Rodape -->
  <rect x="15" y="1045" width="350" height="135" rx="4" class="header-box" />
  <text x="30" y="1070" class="title-text">APEX ENERGY - RODAPE</text>
  <text x="30" y="1090" class="tag-text">Sobre o Portal | Catalogo | Guia de Cafeina</text>
  <text x="30" y="1108" class="tag-text">Loja Local de Bebidas Energeticas</text>
  <text x="30" y="1126" class="tag-text">Redes Sociais: [GitHub] [LinkedIn] [Instagram]</text>
  <text x="30" y="1144" class="sub-text">&#169; 2026 Matheus Santana | WDD 231</text>
  <text x="30" y="1162" class="tag-text">[Link Video Apresentacao]</text>
</svg>