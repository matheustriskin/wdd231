<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="960" height="920">
  <defs>
    <style>
      .bg { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
      .header-box { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .element-box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 2,2; }
      .solid-box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
      .card-box { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
      .title-text { font-family: monospace, sans-serif; font-size: 14px; font-weight: bold; fill: #111827; }
      .sub-text { font-family: monospace, sans-serif; font-size: 11px; fill: #374151; }
      .tag-text { font-family: monospace, sans-serif; font-size: 10px; fill: #6b7280; }
      .btn-box { fill: #111827; stroke: #111827; }
      .btn-text { font-family: monospace, sans-serif; font-size: 11px; fill: #ffffff; font-weight: bold; }
      .line { stroke: #9ca3af; stroke-width: 1; }
      .img-cross { stroke: #9ca3af; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas Desktop -->
  <rect x="5" y="5" width="950" height="910" rx="8" class="bg" />

  <!-- Cabecalho Superior Desktop (Logo + Menu Horizontal) -->
  <rect x="25" y="20" width="910" height="55" rx="4" class="header-box" />
  <rect x="40" y="32" width="130" height="30" class="solid-box" />
  <text x="50" y="52" class="title-text">[LOGO APEX]</text>

  <!-- Links Horizontais de Navegacao com Wayfinding -->
  <text x="350" y="52" class="title-text">Inicio (Ativo)</text>
  <text x="470" y="52" class="sub-text">Catalogo de Bebidas</text>
  <text x="640" y="52" class="sub-text">Guia de Consumo &amp; Contato</text>
  <!-- Botao Favoritos -->
  <rect x="830" y="32" width="90" height="30" rx="3" class="solid-box" />
  <text x="840" y="52" class="sub-text">&#9733; Favoritos [0]</text>

  <!-- Secao Hero Desktop (2 Colunas: Texto/CTA + Imagem Destaque) -->
  <rect x="25" y="90" width="910" height="230" rx="4" class="solid-box" />
  <!-- Coluna Esquerda Hero -->
  <text x="50" y="130" class="title-text" font-size="18px">POTENCIALIZE SUA ENERGIA &amp; FOCO COM CONSCIENCIA</text>
  <text x="50" y="160" class="sub-text">Guia completo e catalogo nutricional detalhado para estudantes, atletas e profissionais.</text>
  <text x="50" y="180" class="sub-text">Conheca composicoes, teores de cafeina e encontre a bebida ideal para seu objetivo.</text>
  <rect x="50" y="210" width="160" height="40" rx="4" class="btn-box" />
  <text x="70" y="235" class="btn-text">EXPLORAR CATALOGO</text>
  <rect x="225" y="210" width="170" height="40" rx="4" class="solid-box" />
  <text x="245" y="235" class="sub-text">CALCULADORA DE CAFEINA</text>

  <!-- Coluna Direita Hero (Imagem Lata com X) -->
  <rect x="550" y="105" width="360" height="200" class="card-box" />
  <line x1="550" y1="105" x2="910" y2="305" class="img-cross" />
  <line x1="910" y1="105" x2="550" y2="305" class="img-cross" />
  <text x="660" y="210" class="title-text">[IMAGEM BANNER HEROI]</text>

  <!-- Secao Categorias em Destaque (4 Colunas) -->
  <rect x="25" y="335" width="910" height="150" rx="4" class="solid-box" />
  <text x="50" y="360" class="title-text">H2: CATEGORIAS EM DESTAQUE NO CATALOGO</text>

  <rect x="50" y="375" width="200" height="90" class="card-box" />
  <text x="65" y="405" class="title-text">Zero Acucar</text>
  <text x="65" y="425" class="tag-text">Baixas calorias e</text>
  <text x="65" y="440" class="tag-text">maximo rendimento</text>

  <rect x="275" y="375" width="200" height="90" class="card-box" />
  <text x="290" y="405" class="title-text">Naturais / Plant</text>
  <text x="290" y="425" class="tag-text">Extrato de cha verde,</text>
  <text x="290" y="440" class="tag-text">guarana e sem aditivos</text>

  <rect x="500" y="375" width="200" height="90" class="card-box" />
  <text x="515" y="405" class="title-text">Foco &amp; Gamer</text>
  <text x="515" y="425" class="tag-text">Nootropicos, taurina</text>
  <text x="515" y="440" class="tag-text">e suporte cognitivo</text>

  <rect x="725" y="375" width="190" height="90" class="card-box" />
  <text x="740" y="405" class="title-text">Pre-Treino</text>
  <text x="740" y="425" class="tag-text">Alta cafeina e</text>
  <text x="740" y="440" class="tag-text">resistencia fisica</text>

  <!-- Secao Ingredientes Funcionais (4 Cards Informativos) -->
  <rect x="25" y="500" width="910" height="155" rx="4" class="solid-box" />
  <text x="50" y="525" class="title-text">H2: GUIA RAPIDO DE INGREDIENTES FUNCIONAIS</text>

  <rect x="50" y="540" width="200" height="95" class="card-box" />
  <text x="65" y="565" class="title-text">Taurina</text>
  <text x="65" y="585" class="sub-text">Aminoacido regulador</text>
  <text x="65" y="605" class="tag-text">Apoio osmotico e contratil</text>

  <rect x="275" y="540" width="200" height="95" class="card-box" />
  <text x="290" y="565" class="title-text">Cafeina Anidra</text>
  <text x="290" y="585" class="sub-text">Estimulo SNC</text>
  <text x="290" y="605" class="tag-text">Bloqueio de adenosina</text>

  <rect x="500" y="540" width="200" height="95" class="card-box" />
  <text x="515" y="565" class="title-text">Vitaminas Complexo B</text>
  <text x="515" y="585" class="sub-text">B3, B5, B6 e B12</text>
  <text x="515" y="605" class="tag-text">Metabolismo energetico</text>

  <rect x="725" y="540" width="190" height="95" class="card-box" />
  <text x="740" y="565" class="title-text">Cha Verde &amp; Guarana</text>
  <text x="740" y="585" class="sub-text">Polifenois e EGCG</text>
  <text x="740" y="605" class="tag-text">Liberacao sustentada</text>

  <!-- Banner Interativo / Calculadora CTA -->
  <rect x="25" y="670" width="910" height="95" rx="4" class="card-box" />
  <text x="50" y="700" class="title-text">FERRAMENTA INTERATIVA: CALCULADORA DE LIMITE DIARIO DE CAFEINA</text>
  <text x="50" y="725" class="sub-text">Insira seu peso corporal e frequencia para descobrir sua ingestao diaria segura recomendada pela Anvisa/EFSA.</text>
  <rect x="700" y="695" width="215" height="40" rx="4" class="btn-box" />
  <text x="720" y="720" class="btn-text">ACESSAR GUIA &amp; CALCULO</text>

  <!-- Rodape Desktop Completo (4 Colunas) -->
  <rect x="25" y="780" width="910" height="120" rx="4" class="header-box" />
  <text x="50" y="805" class="title-text">APEX ENERGY</text>
  <text x="50" y="825" class="tag-text">Portal Informativo de Bebidas</text>
  <text x="50" y="842" class="tag-text">e Loja de Energeticos Especializados</text>
  <text x="50" y="860" class="tag-text">Bahia, Brasil</text>

  <text x="320" y="805" class="title-text">NAVEGACAO</text>
  <text x="320" y="825" class="tag-text">&#8226; Pagina Inicial (Home)</text>
  <text x="320" y="842" class="tag-text">&#8226; Catalogo Dinamico (JSON / Dialog)</text>
  <text x="320" y="860" class="tag-text">&#8226; Guia Consciente &amp; Contato</text>

  <text x="580" y="805" class="title-text">TRANSPARENCIA</text>
  <text x="580" y="825" class="tag-text">&#8226; Tabela de Ingestao Segura</text>
  <text x="580" y="842" class="tag-text">&#8226; Fontes Nutricionais</text>
  <text x="580" y="860" class="tag-text">&#8226; [Video de Demonstracao]</text>

  <text x="780" y="805" class="title-text">DISCIPLINA WDD 231</text>
  <text x="780" y="825" class="tag-text">&#169; 2026 Matheus Santana</text>
  <text x="780" y="842" class="tag-text">BYU-Idaho Online</text>
  <text x="780" y="860" class="tag-text">Redes: [GitHub] [LinkedIn]</text>
</svg>