<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d06a"/>
      <stop offset="100%" stop-color="#c49a45"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133c55"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Classical Pediment / Roof -->
  <polygon points="50,22 26,35 74,35" fill="url(#goldGrad)"/>
  <rect x="25" y="36" width="50" height="4" fill="#ffffff" rx="1"/>
  <!-- Columns -->
  <rect x="29" y="42" width="6" height="23" fill="url(#goldGrad)" rx="1"/>
  <rect x="40" y="42" width="6" height="23" fill="url(#goldGrad)" rx="1"/>
  <rect x="54" y="42" width="6" height="23" fill="url(#goldGrad)" rx="1"/>
  <rect x="65" y="42" width="6" height="23" fill="url(#goldGrad)" rx="1"/>
  <!-- Base Steps -->
  <rect x="23" y="67" width="54" height="4" fill="#ffffff" rx="1"/>
  <rect x="20" y="72" width="60" height="5" fill="url(#goldGrad)" rx="1"/>
  <!-- Central Star / Compass Accent -->
  <polygon points="50,27 51.5,31 55,31 52,33 53.5,37 50,34.5 46.5,37 48,33 45,31 48.5,31" fill="#0b2545"/>
</svg>
